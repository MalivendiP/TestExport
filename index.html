<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hundegalerie 🐶</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        header p {
            margin-top: 10px;
            color: #666;
        }

        .gallery {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #ddd;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <h1>Hundegalerie 🐕</h1>
    <p>Testseite</p>
</header>

<main class="gallery">
    <img src="dog1.jpg" alt="Hund 1">
    <img src="dog2.jpg" alt="Hund 2">
    <img src="dog3.jpg" alt="Hund 3">
</main>

<footer>
    © 2026 · Testprojekt
</footer>

</body>
</html>
